# Comment out the probes you don't need
# CAREFUL: yaml is super sensitive to spaces - don't use tabs


# Simulation parameters
sim_params:
    #sim_name: 'AbacusSummit_base_c000_ph000'                                 # which simulation
    # sim_dir: '/mnt/gosling2/bigsims/'                                        # where is the simulation
    #sim_dir: /mnt/alan1/sbose/scratch/data/cleaned_catalogues/
    output_dir: '/cosma8/data/dp004/dc-mene1/abacusutils/scripts/hod/output/mocks' #'/mnt/marvin1/syuan/scratch/data_mocks_summit_new'          # where to output galaxy mocks
    subsample_dir: '/cosma8/data/dp004/dc-mene1/abacusutils/scripts/hod/output/subsamples' #'/mnt/marvin1/syuan/scratch/data_summit_cleaned/'   # where to output subsample data
    #cleaned_halos: True                                                     # load cleaned halos?

Paths:
  halo_path: '/cosma8/data/dp004/flamingo/Runs/L1000N3600/DMO_FIDUCIAL/SOAP-HBT/halo_properties_0062.hdf5' # SOAP output file at a certain redshift
  params_path: '/cosma8/data/dp004/flamingo/Runs/L1000N3600/DMO_FIDUCIAL/used_parameters.yml'
  ics_path: '/cosma8/data/dp004/flamingo/InitialConditions/L1000N3600/DMO_FIDUCIAL/gen.conf'

Labels:
  sim_label: "Debugging_2halo" # just for labelling output files

Params:
  N: 3600
  L: 1000
  redshift: 0.8

Misc:
  random_seed: 1
  halo_type: soap # soap, peregrinus, ...

prepare_sim:
    Nparallel_load: 1 #5                                          # number of processes. peak memory usage will increase by this factor.
    Nthread_per_load: 'auto'                                   # number of threads per process (auto uses the affinity mask)

# HOD parameters
HOD_params:
    want_ranks: False               # want to implement satellite profile flexiblities?
    want_AB: True                  # are you planning on implementing assembly bias (AB)?
    # Ndim: 1024                     # size of grid for grid based local environment, we opted to use neighbor count based local environment instead
    density_sigma: 3               # scale radius in Mpc / h for local density calculation
    tracer_flags:                  # which tracer do we want?
        LRG: True
        ELG: True
        QSO: True
    want_rsd: True                 # want RSD?
    write_to_disk: True

    # parameters for setting up the HOD of LRGs
    LRG_params:
        logM_cut: 12.8 # 13.0 #13.3
        logM1: 14.0 # 14.24 # 14.4
        sigma: 0.1 # 0.25 #0.6 # 0.6 # 0.8
        alpha: 0.78 # 0.4 # 1.0
        kappa: 0.63 # 0.98 # 0.4
        alpha_c: 0
        alpha_s: 1
        s: 0
        s_v: 0
        s_p: 0
        s_r: 0
        Acent: -0.4
        Asat: 0.2
        Bcent: -0.04
        Bsat: 0.17
        ic: 0.3

    # parameters for setting up the HOD of ELGs
    ELG_params:
        p_max: 0.53
        Q: 10.
        logM_cut: 12.3
        kappa: 1.
        sigma: 0.58
        logM1: 12.0 #30.0 #15.0 #13.53
        logM1_EE: 12.0 #13.0 #13.53
        alpha: 0.9
        gamma: 4.12
        A_s: 1.
        alpha_c: 0
        alpha_s: 1
        s: 0
        s_v: 0
        s_p: 0
        s_r: 0
        Acent: -0.4
        Asat: 0.2
        Bcent: -0.04
        Bsat: 0.17
        exp_frac: 0.5
        exp_scale: 9.0
        nfw_rescale: 0.6
        f_sigv: 1.5
        ic: 0.4

    # parameters for setting up the HOD of QSOs
    QSO_params:
        p_max: 0.33
        logM_cut: 12.21
        kappa: 1.0
        sigma: 0.56
        logM1: 13.94
        alpha: 0.4
        A_s: 1.
        alpha_c: 0
        alpha_s: 1
        s: 0
        s_v: 0
        s_p: 0
        s_r: 0
        Acent: -0.4
        Asat: 0.2
        Bcent: -0.04
        Bsat: 0.17
        ic: 1.0

# clustering parameters
clustering_params:
#    power_type: 'wp'
    clustering_type: 'xirppi'
    bin_params:
        logmin: -2 #-0.77288
        logmax: 2 #1.47712
        nbins: 24 #8
    pimax: 80 #30
    pi_bin_size: 1 #5

# ===========================================================================================
# Specifically for fitting the HOD parameters
fitting_params:
    nwalkers: 64 #720 #36
    num_steps: 200 #300000 #50 #200 #100000
    target_dict_path: "/cosma8/data/dp004/dc-mene1/abacusutils/scripts/hod/fitting_data/Y1_z0.8-1.1/"
    sampler_save_path: "/cosma8/data/dp004/dc-mene1/abacusutils/scripts/hod/samplers/"
    paircounts_save_path: "/cosma8/data/dp004/dc-mene1/abacusutils/scripts/hod/output/paircounts/"

# ===========================================================================================
# The following dictionaries are for using the provided emcee/likelihood templates. They
# are not needed for using the AbacusHOD class and running HODs.

# parameters that indicate where the observed data that you would like to fit live.
data_params:
    tracer_density_mean:
        LRG: 3.0103e-4 # (mpc/h)^-3
    tracer_density_std:
        LRG: 4.0e-5 # (mpc/h)^-3
    tracer_combos:
        LRG_LRG:
            path2power: '/mnt/marvin1/syuan/scratch/targets_xi/data_xi_target_standard.npz'
            path2cov: '/mnt/marvin1/syuan/scratch/targets_xi/data_xi_cov_mock_div8.npz'
#       LRG_ELG:
#            path2power: '/mnt/marvin1/syuan/scratch/targets_xi/data_xi_target_standard.npz'
#            path2cov: '/mnt/marvin1/syuan/scratch/targets_xi/data_xi_cov_mock_div8.npz'
#        ELG_ELG:
#            path2power: '/mnt/marvin1/syuan/scratch/targets_xi/data_xi_target_standard.npz'
#            path2cov: '/mnt/marvin1/syuan/scratch/targets_xi/data_xi_cov_mock_div8.npz'

# Parameters to be fitted in MCMC
# [mapping_index, mean, min, max, std, tr_type]
fit_params:
    logM_cut: [0, 13.1, 12.5, 13.8, 0.03, 'LRG']
    logM1: [1, 14.5, 13.5, 15.5, 0.3, 'LRG']
    sigma: [2, 0.8, 0.1, 1.5, 0.3, 'LRG']
    alpha: [3, 1.0, 0.7, 1.5, 0.2, 'LRG']
    kappa: [4, 0.5, 0.0, 1.0, 0.25, 'LRG']


# Configuration parameters for emcee
ch_config_params:
    path2output: chains/test
    chainsPrefix: test
    use_mpi: 0
    rerun: 0
    walkersRatio: 4
    burninIterations: 2000
    sampleIterations: 40000

# params to be fit for dynesty
dynesty_fit_params:
    logM_cut: [0, 13.3, 0.2, 'LRG']
    logM1: [1, 14.3, 0.2, 'LRG']
    sigma: [2, 0.5, 0.2, 'LRG']

# configuration parameter for dynesty
dynesty_config_params:
    path2output: dynesty/test
    chainsPrefix: test
    rerun: 0
    nlive: 200
    bound: 'multi'
    method: 'unif'
    maxcall: 10000
